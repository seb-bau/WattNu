name: iOS prüfen

on:
  pull_request:
    paths: ['WattNu/**', 'WattNuTests/**', 'WattNu.xcodeproj/**', '.github/workflows/ios-tests.yml']
  push:
    branches: [main]
    paths: ['WattNu/**', 'WattNuTests/**', 'WattNu.xcodeproj/**', '.github/workflows/ios-tests.yml']

permissions:
  contents: read

jobs:
  ios-tests:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Xcode auswählen
        run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - name: Unit-Tests ausführen
        run: >-
          xcodebuild -project WattNu.xcodeproj -scheme WattNu
          -destination 'platform=iOS Simulator,name=iPhone 17,OS=26.2'
          -only-testing:WattNuTests CODE_SIGNING_ALLOWED=NO test
